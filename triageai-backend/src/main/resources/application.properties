spring.application.name=triageai-backend

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080

jwt.secret=${JWT_SECRET:triageai-v2-secure-key-xK9mP3qR7nL2wE8aD5sH1jF6yB4cG0tZ}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

ai.api.key=${GROQ_API_KEY:}
ai.transcription.url=https://api.groq.com/openai/v1/audio/transcriptions
ai.transcription.model=whisper-large-v3
ai.chat.url=https://api.groq.com/openai/v1/chat/completions
ai.chat.model=llama-3.3-70b-versatile

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.com.triageai=INFO
